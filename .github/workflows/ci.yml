name: Verify
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'data/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Data and behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm run check
      - run: python3 scripts/build_data.py --check
      - run: python3 scripts/build_weapon_catalog.py --check
      - name: Install voice test dependencies without models
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          pins = pathlib.Path('scripts/voice-requirements.txt').read_text().splitlines()
          dependencies = [pin for pin in pins if pin.startswith(('numpy==', 'pypinyin=='))]
          assert len(dependencies) == 2
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *dependencies])
          PY
      - run: python3 scripts/build_voice_lexicon.py --check
      - run: python3 tests/voice_server_test.py
      - run: npm test
  android:
    name: Android compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Android SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.1'
      - name: Build without the private release key
        run: NIGHTREIGN_JDK="$JAVA_HOME_17_X64" python3 scripts/build_android.py --unsigned
